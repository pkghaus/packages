name: Bump upstream versions

# Lands one commit on master per package whose upstream has released, then
# dispatches release.yml for it: that builds every suite and architecture, tags
# at the commit and tells the archive to ingest. Nobody approves anything.
#
# The dispatch is explicit rather than left to release.yml's own push trigger,
# because a push made with GITHUB_TOKEN starts no workflow run. Relying on it
# would land bumps on master that were never built, tagged or published, while
# the dashboard read them as current: package.conf would match upstream, which
# is the only question the drift check asks.
#
# Every upstream tag is tracked. No staleness threshold, no filtering, a
# different tag string is the whole rule. croc cut six releases in five days in
# August; that is the known cost of the policy.
#
# Each package is built and DEP-8 tested across all three suites BEFORE its
# commit, and the land job asks about its own package's legs rather than the
# run's aggregate -- one broken package must not hold every other package's bump
# for as long as it stays broken.
#
# This used to open pull requests, which put a person between the bump and the
# archive. Removing them removed two things that person was doing without being
# asked. They could tell which package had failed, because a failed one had no
# pull request and its dashboard row's link column was empty; and if a release
# build failed after a merge they might connect the red run to what they had
# just merged. The dashboard states both -- why a bump did not land, and which
# packages carry a changelog the archive does not serve -- because otherwise the
# failure mode of all this is silence.
#
# It states only those. A bump that built, tested, landed and published is not
# listed at all, and a run with nothing to say writes no issue. Listing the
# successes meant every clean bump left an issue standing that named a package
# as behind hours after the archive had already published it, which trains the
# reader to stop opening the one surface that reports failures.
#
# The one directory this must never write is pkghaus-archive-keyring/: it ships
# the public half of the archive signing key, so changing it is how a compromise
# escalates. Three things stop that, and the third does not live in this file:
# plan-bumps.sh skips a native package, signed-commit's pathspec names only the
# bumped package's two files, and check-keyring-author.sh refuses a bot-authored
# commit that touches it whatever this workflow believes it is doing.


on:
  schedule:
    # Every six hours, matching the archive's own watcher so the two never
    # disagree about how current their view is.
    #
    # Affordable because a bump that passes lands in the same run, so a package
    # is behind for exactly one run and is never rebuilt for work already done.
    # The plan used to skip a package whose version had an open pull request,
    # for the era when landing meant waiting for a human to merge; nothing has
    # opened such a pull request since bumps started landing directly, so that
    # check was 25 gh calls a run that could not match, and it is gone. What
    # does still rebuild every six hours is a bump that keeps FAILING
    # verification, until upstream moves or the packaging is fixed. That is the
    # real repeated cost, the pull-request check never addressed it, and the
    # dashboard names the package so it does not run on unseen.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    # Only the file that can change the plan's answer. Without this filter every
    # README or workflow commit re-renders the dashboard for nothing.
    #
    # This covers a package.conf edited and pushed by a person, and nothing
    # else. It cannot fire for a bump: the land job commits with GITHUB_TOKEN,
    # and a push made with that token starts no workflow run -- the same fact
    # that job relies on when it dispatches release.yml explicitly. It was
    # written when bumps landed as merged pull requests, where the merge was a
    # human push and this trigger re-rendered the dashboard seconds later.
    # Landing directly took that away, so the schedule is now the only thing
    # that closes the issue, which is why the issue exists only when something
    # is wrong.
    paths: ['*/package.conf']

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  plan:
    name: Find upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve every enrolled package against its upstream
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matrix="$(scripts/plan-bumps.sh)"
          scripts/plan-output.sh "$matrix" >> "$GITHUB_OUTPUT"
          printf 'behind upstream: %s\n' "$matrix" >> "$GITHUB_STEP_SUMMARY"

  verify:
    # The arch is in the name because it is now a matrix dimension, and
    # bump-status.sh keys a leg on the first token before " / " -- which stays
    # the package either way.
    name: ${{ matrix.entry.package }} ${{ matrix.entry.tag }} / ${{ matrix.suite }} / ${{ matrix.target.arch }}
    needs: plan
    # Not on a merge. A merge re-renders the dashboard and nothing else: building
    # there would fire on someone else's bump landing, and open would raise pull
    # requests for whatever unrelated packages happened to be behind at the time.
    if: needs.plan.outputs.has_work == 'true' && github.event_name != 'push'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.matrix) }}
        suite: [trixie, testing, unstable]
        # Both architectures, so this covers exactly what release.yml's build
        # job covered -- which is what lets the bump path skip it. Objects
        # rather than a bare arch list, for the reason the reusable build
        # workflow gives: a matrix `include` entry matching no combination adds
        # a job instead of decorating one.
        target:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Apply the bump
        env:
          PKG: ${{ matrix.entry.package }}
          TAG: ${{ matrix.entry.tag }}
        run: scripts/bump-upstream.sh "$PKG" "$TAG"

      # The action operates on the working tree, not on a ref, which is what
      # makes verifying an uncommitted bump possible at all. All three suites on
      # both architectures: this is the tag build, moved earlier. The tree it
      # verifies is byte-identical to the one the land step commits, so
      # repeating it after the tag proved nothing and cost a third of the
      # pipeline's wall clock.
      - name: Build and DEP-8 test the bumped package
        uses: pkghaus/action-debian-build@v1
        with:
          SUITE: ${{ matrix.suite }}
          WORKING_DIRECTORY: ${{ matrix.entry.package }}
  land:
    name: land ${{ matrix.entry.package }}
    needs: [plan, verify]
    # always(), because the gate is per package rather than per run. verify is a
    # matrix and needs.verify.result is its aggregate, so gating on success would
    # let one broken package hold every other package's bump indefinitely --
    # betterlockscreen would have blocked croc for as long as it stayed broken.
    # The step below asks about this package only.
    if: >-
      always()
      && needs.plan.outputs.has_work == 'true'
      && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # To dispatch release.yml below. workflow_dispatch and repository_dispatch
      # are the two events GITHUB_TOKEN can still start; an ordinary push is not.
      actions: write
    strategy:
      fail-fast: false
      # Serialised, and load-bearing. signed-commit reads expectedHeadOid from
      # the local HEAD, so each commit needs master's tip as it is after the
      # previous one landed. In parallel the second write is rejected.
      max-parallel: 1
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # master, not github.sha: the tip moves as earlier packages in this
          # matrix land, and committing against a stale oid is refused.
          ref: master
          persist-credentials: false

      - name: Refuse to land a package whose verification did not pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          PKG: ${{ matrix.entry.package }}
        run: |
          # --slurp because a run with more than a page of jobs would otherwise
          # lose the legs on page two, and a package whose legs went missing
          # reads as unverified, which stops it landing. Silence is not consent.
          #
          # Column 2 is the verify verdict, and it is the only one this step may
          # read. Column 3 is what the land job concluded, and the land job for
          # this package is the one asking: it is in_progress by construction, so
          # consulting it here would refuse every bump forever.
          status="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --slurp \
                    | scripts/bump-status.sh "$MATRIX" \
                    | awk -v p="$PKG" -F'\t' '$1 == p { print $2 }')"
          printf 'verification for %s: %s\n' "$PKG" "${status:-<none>}"
          if [ "$status" != "success" ]; then
              echo "::warning::$PKG did not pass verification (${status:-unknown}); not landing it" >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: gate

      - name: Apply the bump
        if: steps.gate.outputs.skip != 'true'
        id: bump
        env:
          PKG: ${{ matrix.entry.package }}
          TAG: ${{ matrix.entry.tag }}
        run: |
          out="$(scripts/bump-upstream.sh "$PKG" "$TAG")"
          printf '%s\n' "$out"
          line="$(printf '%s\n' "$out" | grep ' -> ' | tail -1)"
          if [ -z "$line" ]; then
            echo "::error::bump-upstream.sh exited 0 without a result line" >&2
            exit 1
          fi
          printf 'version=%s\n' "${line##* }" >> "$GITHUB_OUTPUT"

      # Landing IS releasing. The changelog entry this writes is what
      # release.yml keys on, so the commit below builds every suite and
      # architecture, tags at itself, and tells the archive to ingest.
      - name: Commit to master, signed
        if: steps.gate.outputs.skip != 'true'
        uses: pkghaus/signed-commit@v1
        with:
          workdir: .
          branch: master
          message: "${{ matrix.entry.package }}: new upstream release ${{ steps.bump.outputs.version }}"
          # The pathspec is one of the two things keeping this out of
          # pkghaus-archive-keyring/. The other is check-keyring-author.sh,
          # which does not live inside the workflow it constrains.
          pathspec: |
            ${{ matrix.entry.package }}/package.conf
            ${{ matrix.entry.package }}/debian/changelog
          token: ${{ github.token }}

      # release.yml also triggers on a push to master touching a changelog, and
      # that trigger will NOT fire here: a push made with GITHUB_TOKEN starts no
      # workflow run. workflow_dispatch is one of the two events it can still
      # start, which is the same reason release.yml dispatches the archive
      # rather than relying on the tag it creates to trigger build.yml.
      #
      # Harmless if the push trigger ever does fire as well. plan-release.sh
      # drops any package whose tag already exists, so whichever run gets there
      # first releases and the other plans nothing. That idempotency was built
      # for a hand-pushed tag racing a merge and covers this too.
      - name: Release it
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PKG: ${{ matrix.entry.package }}
        run: |
          # skip_build, because verify above already built this exact tree
          # across all three suites and both architectures. release.yml honours
          # it only for the bot; a hand dispatch always gets the gate.
          gh workflow run release.yml --repo "$REPO" \
              -f package="$PKG" -f skip_build=true
          printf 'dispatched release for %s\n' "$PKG" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Drift dashboard
    needs: [plan, verify, land]
    # always(): a run whose verification failed is exactly the run whose outcome
    # nobody would otherwise see. Nothing lands for such a package, and a red run
    # in a repository nobody watches notifies no one.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Open, update or close the dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A package packaged but not published is invisible to the drift check
          # above -- package.conf matches upstream, so it reads as current -- and
          # nothing retries it. An unreadable archive reports nothing rather than
          # inventing 25 stuck packages, so a blip cannot fill the issue.
          #
          # Not while a release is running. The comparison cannot tell a release
          # in progress from one that failed -- in both, the changelog is on
          # master and the archive is not caught up -- and on 2026-09-02 it
          # accused a release that was succeeding as it wrote, having started
          # one second earlier. A real failure is still reported, six hours
          # later, by a run with nothing in flight.
          in_flight="$(scripts/release-in-flight.sh)"
          stuck='[]'
          published_checked=no
          if [ "$in_flight" = yes ]; then
              echo "a release or ingest is running; skipping the published check"
          elif out="$(scripts/check-published.sh 2>/dev/null)"; then
              stuck="$out"
              published_checked=yes
          else
              echo "::warning::could not read the archive; skipping the published check" >&2
          fi

          # A push runs neither verify nor land, so this run holds no verdict on
          # any package. Asking for one would read every planned package as "not
          # verified" -- a false alarm rather than a missing job -- and raise an
          # issue naming packages an earlier run had already tested.
          verified=yes
          status=''
          if [ "$EVENT" = push ]; then
              verified=no
          else
              # --slurp because a run with more than a page of jobs would
              # otherwise lose the legs on page two, and a package whose legs
              # went missing reads as unverified rather than as fine.
              #
              # Both columns here, unlike the land gate above: by now every land
              # job has finished, and a package that verified green and then
              # failed to land is exactly the case nothing else reports.
              status="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --slurp \
                        | scripts/bump-status.sh "$MATRIX" || true)"
          fi

          # The renderer decides whether anything is wrong, and says so by
          # producing a body or producing nothing. It is deliberately not asked
          # whether the plan found work: a run that lands a bump has has_work
          # true for its whole life, so keying the issue on that meant every
          # successful bump left one open until the next scheduled run.
          scripts/drift-report.sh "$MATRIX" "$status" "$stuck" "$RUN_URL" "$verified" > body.md

          # Creating, editing, closing or leaving the issue is one decision and
          # it lives in a script, where a test can reach it. It is the only
          # decision here nobody else makes: whether a failure gets reported.
          scripts/dashboard.sh body.md "$verified" "$published_checked" "$RUN_URL"
