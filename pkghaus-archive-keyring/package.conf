# A native package: the signing key is in keys/ right here, so there is no
# upstream to clone and no release feed to track. UPSTREAM and VERSION are
# refused for a native package rather than ignored (action-debian-build >=
# v1.5.0), because a leftover value is likelier to be a stale file than an
# intention.
#
# The file still has to exist even though it names almost nothing: build.yml's
# planner and release.yml both use `[ -f "<dir>/package.conf" ]` to decide that
# a directory is a package, so deleting it would silently un-register the
# keyring from both.
TOOLCHAIN=none
DBGSYM=0
